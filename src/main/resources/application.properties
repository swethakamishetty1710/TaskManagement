spring.application.name=TaskManagement

server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/task_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MySQL@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=ThisIsMyVerySecretKeyForTaskManagementApplication123456
jwt.expiration=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

file.upload-dir=uploads/tasks